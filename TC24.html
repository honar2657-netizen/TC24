<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10233f">
<title>TC24 | إدارة المبيعات</title>
<style>
:root{--navy:#10233f;--navy2:#193653;--teal:#159b91;--bg:#f3f6fa;--ink:#17263b;--muted:#718096;--line:#e4eaf1;--white:#fff;--red:#c24141;--gold:#d99a28}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:var(--teal);color:#fff;font-weight:700}.secondary{background:#e9f1f5;color:var(--navy)}.danger{background:#fff0f0;color:var(--red)}.dark{background:var(--navy)}.hidden{display:none!important}.app{min-height:100vh}.top{background:var(--navy);color:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:13px;background:var(--teal);display:grid;place-items:center;font-size:20px;font-weight:900}.brand h1{margin:0;font-size:22px;letter-spacing:1px}.brand small{color:#b8c9dc}.userbar{display:flex;align-items:center;gap:10px}.layout{display:grid;grid-template-columns:225px 1fr;max-width:1500px;margin:auto;min-height:calc(100vh - 76px)}aside{background:#fff;border-left:1px solid var(--line);padding:18px 12px}.navbtn{display:flex;width:100%;text-align:right;background:transparent;color:#33445b;margin:4px 0;gap:10px;align-items:center}.navbtn.active,.navbtn:hover{background:#eaf6f5;color:#087f78}.main{padding:24px;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.pagehead h2{margin:0 0 5px;font-size:24px}.muted{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 3px 14px #18365308}.metric{font-size:25px;font-weight:800;margin:9px 0 3px}.metric-label{color:var(--muted);font-size:13px}.panel{margin-bottom:16px}.panel h3{margin:0 0 14px;font-size:17px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:700;color:#40516a}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #dbe3ec;border-radius:10px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #159b9118}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px 10px;text-align:right;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}th{color:#66758a;background:#f8fafc;font-weight:700}.pill{display:inline-block;border-radius:30px;padding:5px 9px;font-size:11px;background:#eef2f7;color:#526176}.pill.done{background:#e7f7ef;color:#13784a}.pill.new{background:#fff5df;color:#94630a}.pill.cancel{background:#fff0f0;color:#b33}.searchrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.searchrow input{flex:1;min-width:200px}.login{max-width:430px;margin:7vh auto;padding:25px}.login .logo{margin:auto;width:62px;height:62px;font-size:26px}.login h2{text-align:center}.notice{background:#fff8e8;border:1px solid #f2dfae;color:#785a17;padding:12px;border-radius:10px;font-size:12px;line-height:1.8;margin-top:15px}.empty{text-align:center;padding:30px;color:var(--muted)}.smallbtn{padding:7px 10px;font-size:12px}.bar{height:9px;border-radius:9px;background:#edf1f5;overflow:hidden}.bar span{display:block;height:100%;background:var(--teal)}.reportline{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.footnote{font-size:12px;color:var(--muted);line-height:1.8}.toast{position:fixed;bottom:20px;left:20px;background:#122a45;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 6px 25px #0002;z-index:9}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-left:0;border-bottom:1px solid var(--line);padding:8px}.navbtn{width:auto;white-space:nowrap;margin:0 3px}.main{padding:15px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.cards{gap:8px}.card{padding:12px}.metric{font-size:20px}.formgrid,.grid2{grid-template-columns:1fr}.top{padding:12px}.userbar{width:100%;justify-content:space-between}.pagehead h2{font-size:20px}}
@media print{.top,aside,.no-print,button{display:none!important}.layout{display:block}.main{padding:0}.panel,.card{box-shadow:none;break-inside:avoid}body{background:#fff}table{min-width:0}th,td{font-size:10px;padding:6px}}
</style></head>
<body><div id="loginView" class="panel login"><div class="logo">TC</div><h2>تسجيل الدخول إلى TC24</h2><p class="muted" style="text-align:center">نظام إدارة المبيعات والعملاء</p><div class="field"><label>اسم المستخدم</label><input id="loginUser" autocomplete="username" value="Ta24"></div><div class="field" style="margin-top:12px"><label>كلمة المرور</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور"></div><button style="width:100%;margin-top:16px" onclick="login()">دخول</button><div class="notice">حساب الإدارة المبدئي: Ta24 — كلمة المرور: 0000. غيّر كلمة المرور فور بدء الاستخدام.</div></div>
<div id="appView" class="app hidden"><header class="top"><div class="brand"><div class="logo">TC</div><div><h1>TC24</h1><small>SALES MANAGEMENT SYSTEM</small></div></div><div class="userbar"><span id="who"></span><button class="secondary smallbtn" onclick="logout()">تسجيل الخروج</button></div></header><div class="layout"><aside id="nav"><button class="navbtn active" data-page="dashboard" onclick="go('dashboard',this)">▦　الرئيسية</button><button class="navbtn" data-page="customers" onclick="go('customers',this)">♙　العملاء والطلبات</button><button class="navbtn" data-page="add" onclick="go('add',this)">＋　إضافة عميل / طلب</button><button class="navbtn" data-page="collections" onclick="go('collections',this)">▤　التحصيلات</button><button class="navbtn" data-page="reports" onclick="go('reports',this)">▥　التقارير والإحصائيات</button><button class="navbtn admin-only" data-page="users" onclick="go('users',this)">♧　الموظفون</button><button class="navbtn" data-page="settings" onclick="go('settings',this)">⚙　الإعدادات</button></aside><main class="main"><section id="page-dashboard"></section><section id="page-customers" class="hidden"></section><section id="page-add" class="hidden"></section><section id="page-collections" class="hidden"></section><section id="page-reports" class="hidden"></section><section id="page-users" class="hidden"></section><section id="page-settings" class="hidden"></section></main></div></div><div id="toast" class="toast hidden"></div>
<script>
const KEY='tc24_demo_v1';let db,session=null,editingId=null;
const today=()=>new Date().toISOString().slice(0,10),month=()=>today().slice(0,7),fmt=n=>(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2})+' ر.س',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db)db={users:[{username:'Ta24',password:'0000',role:'admin',name:'مدير النظام'}],customers:[],orders:[],collections:[]};save()};function save(){localStorage.setItem(KEY,JSON.stringify(db))}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2600)}
function login(){let u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value,user=db.users.find(x=>x.username===u&&x.password===p);if(!user){toast('اسم المستخدم أو كلمة المرور غير صحيحة');return}session=user;document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('who').textContent=user.name+' • '+(user.role==='admin'?'أدمن':'موظف');document.querySelectorAll('.admin-only').forEach(x=>x.classList.toggle('hidden',user.role!=='admin'));renderAll();go('dashboard')}
function logout(){session=null;document.getElementById('appView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden');document.getElementById('loginPass').value=''}function go(p,btn){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById('page-'+p).classList.remove('hidden');document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.page===p));if(p==='dashboard')renderDash();if(p==='customers')renderCustomers();if(p==='add')renderAdd();if(p==='collections')renderCollections();if(p==='reports')renderReports();if(p==='users')renderUsers();if(p==='settings')renderSettings()}
function renderAll(){renderDash();renderCustomers();renderAdd();renderCollections();renderReports();renderUsers();renderSettings()}
function sum(a,k){return a.reduce((s,x)=>s+(Number(x[k])||0),0)}function customerName(id){return db.customers.find(c=>c.id===id)?.name||'عميل محذوف'}
function renderDash(){let d=today(),m=month(),orders=db.orders,dayOrders=orders.filter(o=>o.date===d),mo=orders.filter(o=>o.date.startsWith(m)),done=orders.filter(o=>o.status==='تم التنفيذ'),cashD=db.collections.filter(c=>c.date===d),cashM=db.collections.filter(c=>c.date.startsWith(m));document.getElementById('page-dashboard').innerHTML=`<div class="pagehead"><div><h2>لوحة التحكم</h2><div class="muted">ملخص حركة المبيعات — ${d}</div></div><button onclick="go('add')">＋ إضافة طلب جديد</button></div><div class="cards"><div class="card"><div class="metric-label">إجمالي العملاء</div><div class="metric">${db.customers.length}</div></div><div class="card"><div class="metric-label">طلبات اليوم</div><div class="metric">${dayOrders.length}</div></div><div class="card"><div class="metric-label">مبيعات اليوم</div><div class="metric">${fmt(sum(dayOrders,'amount'))}</div></div><div class="card"><div class="metric-label">مبيعات الشهر</div><div class="metric">${fmt(sum(mo,'amount'))}</div></div><div class="card"><div class="metric-label">الطلبات المنفذة (كل الفترات)</div><div class="metric">${done.length}</div></div><div class="card"><div class="metric-label">تحصيلات اليوم</div><div class="metric">${fmt(sum(cashD,'amount'))}</div></div><div class="card"><div class="metric-label">تحصيلات الشهر</div><div class="metric">${fmt(sum(cashM,'amount'))}</div></div><div class="card"><div class="metric-label">إجمالي قيمة الطلبات هذا الشهر</div><div class="metric">${fmt(sum(mo,'amount'))}</div></div></div><div class="grid2"><div class="panel"><h3>آخر الطلبات</h3>${orders.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,6).map(o=>`<div class="reportline"><span>${esc(customerName(o.customerId))} <span class="muted">#${esc(o.code)}</span></span><b>${fmt(o.amount)}</b></div>`).join('')||'<div class="empty">لا توجد طلبات مسجلة حتى الآن</div>'}</div><div class="panel"><h3>ملخص الكميات هذا الشهر</h3>${[['دكت','duct'],['اسبليت','split'],['فلتر','filter'],['ماكينة','machine']].map(([n,k])=>`<div class="reportline"><span>${n}</span><b>${sum(mo,k)}</b></div>`).join('')}</div></div>`}
function renderAdd(){let c=db.customers.find(x=>x.id===editingId),o=c?db.orders.find(x=>x.id===c.lastOrderId):null;document.getElementById('page-add').innerHTML=`<div class="pagehead"><div><h2>${c?'تعديل بيانات العميل':'إضافة عميل وطلب'}</h2><div class="muted">سجّل تاريخ الطلب حتى لو كان بتاريخ سابق</div></div></div><div class="panel"><h3>أولاً: بيانات العميل</h3><div class="formgrid"><div class="field"><label>تاريخ الطلب *</label><input id="fDate" type="date" value="${o?.date||today()}"></div><div class="field"><label>اسم العميل *</label><input id="fName" value="${esc(c?.name||'')}" placeholder="اسم العميل"></div><div class="field"><label>رقم الجوال</label><input id="fPhone" inputmode="tel" value="${esc(c?.phone||'')}" placeholder="05xxxxxxxx"></div><div class="field"><label>رقم الكود *</label><input id="fCode" value="${esc(c?.code||'')}" placeholder="كود العميل"></div><div class="field full"><label>الحي أو المنطقة</label><input id="fArea" value="${esc(c?.area||'')}" placeholder="الحي / المنطقة"></div></div></div><div class="panel"><h3>ثانياً: بيانات الطلب والمبيعات</h3><div class="formgrid"><div class="field"><label>عدد الدكت</label><input id="fDuct" type="number" min="0" step="1" value="${o?.duct||0}"></div><div class="field"><label>عدد الاسبليت</label><input id="fSplit" type="number" min="0" step="1" value="${o?.split||0}"></div><div class="field"><label>عدد الفلتر</label><input id="fFilter" type="number" min="0" step="1" value="${o?.filter||0}"></div><div class="field"><label>عدد الماكينة</label><input id="fMachine" type="number" min="0" step="1" value="${o?.machine||0}"></div><div class="field"><label>قيمة الطلب (ريال سعودي)</label><input id="fAmount" type="number" min="0" step="0.01" value="${o?.amount||''}" placeholder="أدخل إجمالي قيمة الطلب يدوياً"></div><div class="field"><label>حالة الطلب</label><select id="fStatus"><option ${o?.status==='جديد'?'selected':''}>جديد</option><option ${o?.status==='قيد التنفيذ'?'selected':''}>قيد التنفيذ</option><option ${o?.status==='تم التنفيذ'?'selected':''}>تم التنفيذ</option><option ${o?.status==='ملغي'?'selected':''}>ملغي</option></select></div><div class="field full"><label>ملاحظات</label><textarea id="fNotes" rows="2">${esc(o?.notes||'')}</textarea></div></div><div class="actions"><button onclick="saveCustomerOrder()">${c?'حفظ التعديلات':'حفظ بيانات العميل والطلب'}</button><button class="secondary" onclick="editingId=null;renderAdd()">تفريغ الحقول</button></div><p class="footnote">* رقم الكود يجب أن يكون فريداً لكل عميل. يمكن للعميل نفسه أن يكون له أكثر من طلب من صفحة العملاء.</p></div>`}
function saveCustomerOrder(){let v=id=>document.getElementById(id).value.trim(),name=v('fName'),code=v('fCode'),date=v('fDate');if(!name||!code||!date){toast('أدخل الاسم والكود والتاريخ');return}let duplicate=db.customers.find(c=>c.code.toLowerCase()===code.toLowerCase()&&c.id!==editingId);if(duplicate){toast('رقم الكود مسجل بالفعل لعميل آخر');return}let c=editingId?db.customers.find(x=>x.id===editingId):null;if(!c){c={id:crypto.randomUUID(),createdAt:Date.now()};db.customers.push(c)}Object.assign(c,{name,code,phone:v('fPhone'),area:v('fArea'),updatedAt:Date.now()});let o={id:crypto.randomUUID(),customerId:c.id,code,date,duct:num('fDuct'),split:num('fSplit'),filter:num('fFilter'),machine:num('fMachine'),amount:num('fAmount'),status:v('fStatus'),notes:v('fNotes'),createdBy:session.username,createdAt:Date.now()};if(editingId){let old=db.orders.find(x=>x.id===c.lastOrderId);if(old)Object.assign(old,o,{id:old.id});else db.orders.push(o)}else db.orders.push(o);c.lastOrderId=editingId?(c.lastOrderId||o.id):o.id;save();editingId=null;toast('تم حفظ البيانات بنجاح');renderAll();go('customers')}
function num(id){let n=Number(document.getElementById(id).value);return Number.isFinite(n)&&n>=0?n:0}
function renderCustomers(q=''){let rows=db.customers.filter(c=>(c.name+' '+c.code+' '+c.phone+' '+c.area).toLowerCase().includes(q.toLowerCase()));document.getElementById('page-customers').innerHTML=`<div class="pagehead"><div><h2>العملاء والطلبات</h2><div class="muted">${db.customers.length} عميل مسجل</div></div><button onclick="editingId=null;go('add')">＋ إضافة عميل</button></div><div class="panel"><div class="searchrow"><input id="custSearch" placeholder="ابحث بالاسم أو رقم الكود أو الجوال أو المنطقة" value="${esc(q)}" oninput="renderCustomers(this.value)"><button class="secondary" onclick="exportCSV('customers')">تصدير العملاء Excel</button><button class="secondary" onclick="window.print()">طباعة القائمة الحالية</button></div><div class="panel no-print" style="background:#f8fbfd;margin-top:12px"><h3>طباعة كشف العملاء حسب الفترة</h3><div class="formgrid"><div class="field"><label>نوع الكشف</label><select id="customerPrintPeriod" onchange="toggleCustomerPrintPeriod()"><option value="day">عملاء اليوم</option><option value="month" selected>عملاء الشهر</option></select></div><div class="field" id="customerPrintDayWrap"><label>اختر اليوم</label><input type="date" id="customerPrintDay" value="${today()}"></div><div class="field" id="customerPrintMonthWrap" style="display:none"><label>اختر الشهر</label><input type="month" id="customerPrintMonth" value="${month()}"></div></div><div class="actions"><button onclick="printCustomerSheet()">🖨️ تجهيز كشف العملاء للطباعة</button><span class="footnote">سيتم ترتيب العملاء تحت بعض في صفحات A4، مع بيانات العميل والطلبات والكميات وإجمالي المبيعات.</span></div></div><div class="tablewrap"><table><thead><tr><th>الكود</th><th>اسم العميل</th><th>الجوال</th><th>المنطقة</th><th>عدد الطلبات</th><th>إجمالي المبيعات</th><th>واتساب</th><th>إجراءات</th></tr></thead><tbody>${rows.map(c=>{let os=db.orders.filter(o=>o.customerId===c.id);return `<tr><td><b>${esc(c.code)}</b></td><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.area)}</td><td>${os.length}</td><td>${fmt(sum(os,'amount'))}</td><td>${c.phone?`<a target="_blank" rel="noopener" href="https://wa.me/${esc(c.phone.replace(/[^0-9]/g,''))}">فتح واتساب</a>`:'—'}</td><td><button class="smallbtn secondary" onclick="customerDetails('${c.id}')">عرض</button> <button class="smallbtn secondary" onclick="editCustomer('${c.id}')">تعديل</button> ${session.role==='admin'?`<button class="smallbtn danger" onclick="deleteCustomer('${c.id}')">حذف</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">لا توجد نتائج</td></tr>'}</tbody></table></div></div><div id="customerDetail"></div>`}
function editCustomer(id){editingId=id;go('add')};function deleteCustomer(id){if(!confirm('حذف العميل وجميع طلباته؟ لا يمكن التراجع.'))return;db.customers=db.customers.filter(c=>c.id!==id);db.orders=db.orders.filter(o=>o.customerId!==id);save();renderCustomers();toast('تم الحذف')}
function customerDetails(id){let c=db.customers.find(x=>x.id===id),os=db.orders.filter(o=>o.customerId===id);document.getElementById('customerDetail').innerHTML=`<div class="panel"><h3>سجل العميل: ${esc(c.name)} — ${esc(c.code)}</h3><div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>دكت</th><th>اسبليت</th><th>فلتر</th><th>ماكينة</th><th>القيمة</th><th>الحالة</th></tr></thead><tbody>${os.map(o=>`<tr><td>${o.date}</td><td>${o.duct}</td><td>${o.split}</td><td>${o.filter}</td><td>${o.machine}</td><td>${fmt(o.amount)}</td><td>${esc(o.status)}</td></tr>`).join('')||'<tr><td colspan="7">لا توجد طلبات</td></tr>'}</tbody></table></div><div class="actions"><button onclick="newOrderFor('${id}')">＋ طلب جديد لهذا العميل</button></div></div>`}
function newOrderFor(id){let c=db.customers.find(x=>x.id===id);editingId=null;go('add');setTimeout(()=>{document.getElementById('fName').value=c.name;document.getElementById('fCode').value=c.code;document.getElementById('fPhone').value=c.phone;document.getElementById('fArea').value=c.area},0)}
function renderCollections(){let rows=db.collections.slice().sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('page-collections').innerHTML=`<div class="pagehead"><div><h2>التحصيلات والوارد</h2><div class="muted">تسجيل المبالغ الواردة للشركة ومتابعتها</div></div></div><div class="panel"><h3>تسجيل تحصيل جديد</h3><div class="formgrid"><div class="field"><label>التاريخ</label><input type="date" id="colDate" value="${today()}"></div><div class="field"><label>العميل (اختياري)</label><select id="colCustomer"><option value="">بدون ربط بعميل</option>${db.customers.map(c=>`<option value="${c.id}">${esc(c.code)} — ${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>المبلغ (ريال)</label><input id="colAmount" type="number" min="0.01" step="0.01"></div><div class="field"><label>طريقة التحصيل</label><select id="colMethod"><option>تحويل بنكي</option><option>نقدي</option><option>شبكة</option><option>أخرى</option></select></div><div class="field full"><label>ملاحظات</label><input id="colNote"></div></div><div class="actions"><button onclick="addCollection()">حفظ التحصيل</button><button class="secondary" onclick="exportCSV('collections')">تصدير التحصيلات Excel</button></div></div><div class="panel"><h3>سجل التحصيلات — الإجمالي ${fmt(sum(rows,'amount'))}</h3><div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>العميل</th><th>المبلغ</th><th>الطريقة</th><th>ملاحظات</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr><td>${c.date}</td><td>${esc(c.customerId?customerName(c.customerId):'—')}</td><td>${fmt(c.amount)}</td><td>${esc(c.method)}</td><td>${esc(c.note)}</td><td>${session.role==='admin'?`<button class="smallbtn danger" onclick="deleteCollection('${c.id}')">حذف</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا توجد تحصيلات</td></tr>'}</tbody></table></div></div>`}
function addCollection(){let amount=Number(document.getElementById('colAmount').value);if(!amount||amount<=0){toast('أدخل مبلغاً صحيحاً');return}db.collections.push({id:crypto.randomUUID(),date:document.getElementById('colDate').value,customerId:document.getElementById('colCustomer').value,amount,method:document.getElementById('colMethod').value,note:document.getElementById('colNote').value,createdBy:session.username});save();renderCollections();renderDash();toast('تم تسجيل التحصيل')};function deleteCollection(id){if(!confirm('حذف التحصيل؟'))return;db.collections=db.collections.filter(x=>x.id!==id);save();renderCollections()}

function toggleCustomerPrintPeriod(){let mode=document.getElementById('customerPrintPeriod')?.value||'month';document.getElementById('customerPrintDayWrap').style.display=mode==='day'?'flex':'none';document.getElementById('customerPrintMonthWrap').style.display=mode==='month'?'flex':'none'}
function printCustomerSheet(){let mode=document.getElementById('customerPrintPeriod')?.value||'month',period=mode==='day'?document.getElementById('customerPrintDay').value:document.getElementById('customerPrintMonth').value;if(!period){toast('اختر التاريخ أو الشهر أولاً');return}let orders=db.orders.filter(o=>mode==='day'?o.date===period:o.date.startsWith(period)).sort((a,b)=>a.date.localeCompare(b.date)||String(a.code||'').localeCompare(String(b.code||''),'ar'));let grouped=new Map();orders.forEach(o=>{let c=db.customers.find(x=>x.id===o.customerId)||{id:o.customerId,code:o.code||'',name:'عميل غير مسجل',phone:'',area:''};if(!grouped.has(c.id))grouped.set(c.id,{customer:c,orders:[]});grouped.get(c.id).orders.push(o)});let groups=[...grouped.values()],totalSales=sum(orders,'amount'),title=mode==='day'?'كشف عملاء اليوم':'كشف عملاء الشهر';let cards=groups.map((g,i)=>{let c=g.customer,os=g.orders;return `<article class="customer"><div class="customer-head"><strong>${i+1}. ${esc(c.name)}</strong><span>كود: ${esc(c.code||'—')}</span></div><div class="details"><div><b>الجوال:</b> ${esc(c.phone||'—')}</div><div><b>الحي / المنطقة:</b> ${esc(c.area||'—')}</div></div><table><thead><tr><th>تاريخ الطلب</th><th>دكت</th><th>اسبليت</th><th>فلتر</th><th>ماكينة</th><th>قيمة الطلب</th><th>الحالة</th></tr></thead><tbody>${os.map(o=>`<tr><td>${esc(o.date)}</td><td>${Number(o.duct)||0}</td><td>${Number(o.split)||0}</td><td>${Number(o.filter)||0}</td><td>${Number(o.machine)||0}</td><td>${fmt(o.amount)}</td><td>${esc(o.status||'—')}</td></tr>`).join('')}</tbody></table><div class="customer-total">إجمالي مبيعات العميل خلال الفترة: ${fmt(sum(os,'amount'))}　|　عدد الطلبات: ${os.length}</div></article>`}).join('');let win=window.open('','_blank');if(!win){toast('اسمح بفتح النوافذ المنبثقة لطباعة الكشف');return}win.document.open();win.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TC24 - ${title}</title><style>*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;color:#17263b;margin:0;padding:22px;background:#fff}.head{border-bottom:3px solid #159b91;padding-bottom:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:24px;font-weight:900;color:#10233f}.muted{color:#66758a;font-size:12px;margin-top:5px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 18px}.box{border:1px solid #dfe7ef;border-radius:9px;padding:10px}.box small{display:block;color:#66758a;margin-bottom:5px}.box b{font-size:17px}.customer{border:1px solid #dce5ed;border-radius:10px;padding:12px;margin:0 0 12px;break-inside:avoid;page-break-inside:avoid}.customer-head{display:flex;justify-content:space-between;gap:10px;background:#f1f7f8;padding:9px;border-radius:7px}.details{display:flex;gap:22px;flex-wrap:wrap;padding:9px 2px;font-size:12px}.customer table{width:100%;border-collapse:collapse;min-width:0}.customer th,.customer td{border:1px solid #dfe5ec;padding:7px;text-align:right;font-size:11px}.customer th{background:#f5f7fa}.customer-total{text-align:left;font-weight:bold;font-size:12px;margin-top:8px;color:#087f78}.foot{margin-top:18px;padding-top:9px;border-top:1px solid #ddd;font-size:10px;color:#66758a;text-align:center}@page{size:A4;margin:12mm}@media print{body{padding:0}.no-print{display:none}}@media(max-width:600px){body{padding:10px}.summary{grid-template-columns:1fr 1fr}.customer-head{flex-direction:column}}</style></head><body><header class="head"><div><div class="brand">TC24</div><div class="muted">نظام إدارة المبيعات والعملاء</div></div><div style="text-align:left"><b>${title}</b><div class="muted">الفترة: ${esc(period)}</div><div class="muted">تاريخ الطباعة: ${today()}</div></div></header><section class="summary"><div class="box"><small>عدد العملاء</small><b>${groups.length}</b></div><div class="box"><small>عدد الطلبات</small><b>${orders.length}</b></div><div class="box"><small>إجمالي المبيعات</small><b>${fmt(totalSales)}</b></div></section>${cards||'<p style="text-align:center;padding:35px">لا توجد طلبات مسجلة خلال الفترة المحددة.</p>'}<footer class="foot">TC24 • كشف العملاء والطلبات • تم إنشاء التقرير من بيانات النظام</footer><script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);win.document.close();toast('تم تجهيز كشف العملاء للطباعة')}
function renderReports(){let months=[...new Set([...db.orders.map(o=>o.date.slice(0,7)),...db.collections.map(c=>c.date.slice(0,7))])].sort().reverse();document.getElementById('page-reports').innerHTML=`<div class="pagehead"><div><h2>التقارير والإحصائيات</h2><div class="muted">ملخص شهري قابل للتصدير والإرسال للشركة</div></div><div class="actions no-print"><button onclick="exportCSV('orders')">تصدير كل الطلبات Excel</button><button class="secondary" onclick="exportCSV('monthly')">تقرير شهري Excel</button><button class="secondary" onclick="window.print()">طباعة / حفظ PDF</button></div></div><div class="panel"><h3>تقرير شهر محدد</h3><div class="searchrow"><input type="month" id="reportMonth" value="${month()}" onchange="updateMonthReport()"></div><div id="monthReport"></div></div><div class="panel"><h3>مقارنة الأداء بين الشهور</h3><div class="tablewrap"><table><thead><tr><th>الشهر</th><th>عدد العملاء الجدد</th><th>عدد الطلبات</th><th>الطلبات المنفذة</th><th>قيمة المبيعات</th><th>التحصيلات</th><th>الكميات (دكت/اسبليت/فلتر/ماكينة)</th></tr></thead><tbody>${months.map(m=>{let os=db.orders.filter(o=>o.date.startsWith(m)),cs=db.customers.filter(c=>c.createdAt&&new Date(c.createdAt).toISOString().startsWith(m)),col=db.collections.filter(c=>c.date.startsWith(m));return `<tr><td>${m}</td><td>${cs.length}</td><td>${os.length}</td><td>${os.filter(o=>o.status==='تم التنفيذ').length}</td><td>${fmt(sum(os,'amount'))}</td><td>${fmt(sum(col,'amount'))}</td><td>${sum(os,'duct')} / ${sum(os,'split')} / ${sum(os,'filter')} / ${sum(os,'machine')}</td></tr>`}).join('')||'<tr><td colspan="7">لا توجد بيانات بعد</td></tr>'}</tbody></table></div></div>`;updateMonthReport()}
function updateMonthReport(){let el=document.getElementById('monthReport');if(!el)return;let m=document.getElementById('reportMonth').value,os=db.orders.filter(o=>o.date.startsWith(m)),cs=db.collections.filter(c=>c.date.startsWith(m)),done=os.filter(o=>o.status==='تم التنفيذ');el.innerHTML=`<div class="cards"><div class="card"><div class="metric-label">العملاء الجدد</div><div class="metric">${db.customers.filter(c=>c.createdAt&&new Date(c.createdAt).toISOString().startsWith(m)).length}</div></div><div class="card"><div class="metric-label">الطلبات</div><div class="metric">${os.length}</div></div><div class="card"><div class="metric-label">المبيعات</div><div class="metric">${fmt(sum(os,'amount'))}</div></div><div class="card"><div class="metric-label">التحصيلات</div><div class="metric">${fmt(sum(cs,'amount'))}</div></div></div><div class="reportline"><span>الطلبات المنفذة</span><b>${done.length}</b></div><div class="reportline"><span>قيمة الطلبات المنفذة</span><b>${fmt(sum(done,'amount'))}</b></div><div class="reportline"><span>إجمالي الكميات (دكت / اسبليت / فلتر / ماكينة)</span><b>${sum(os,'duct')} / ${sum(os,'split')} / ${sum(os,'filter')} / ${sum(os,'machine')}</b></div><div class="reportline"><span>الفرق بين قيمة الطلبات والتحصيلات (مؤشر حسابي فقط)</span><b>${fmt(sum(os,'amount')-sum(cs,'amount'))}</b></div><p class="footnote">الفرق ليس رصيد مستحق مؤكداً إلا إذا كانت كل التحصيلات مرتبطة بالطلبات نفسها. لا يتم افتراض أن التحصيل يخص مبيعات الشهر.</p>`}
function renderUsers(){if(session.role!=='admin')return;document.getElementById('page-users').innerHTML=`<div class="pagehead"><div><h2>إدارة الموظفين</h2><div class="muted">إنشاء حسابات دخول للموظفين</div></div></div><div class="panel"><h3>إضافة موظف</h3><div class="formgrid"><div class="field"><label>اسم الموظف</label><input id="uName"></div><div class="field"><label>اسم المستخدم</label><input id="uUser"></div><div class="field"><label>كلمة المرور</label><input id="uPass" type="password"></div></div><div class="actions"><button onclick="addUser()">إنشاء الحساب</button></div></div><div class="panel"><h3>الحسابات الحالية</h3><div class="tablewrap"><table><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الصلاحية</th><th></th></tr></thead><tbody>${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${u.role==='admin'?'أدمن':'موظف'}</td><td>${u.username!=='Ta24'?`<button class="smallbtn danger" onclick="removeUser('${esc(u.username)}')">حذف الحساب</button>`:'الحساب الرئيسي'}</td></tr>`).join('')}</tbody></table></div></div>`}
function addUser(){let name=document.getElementById('uName').value.trim(),username=document.getElementById('uUser').value.trim(),password=document.getElementById('uPass').value;if(!name||!username||password.length<4){toast('أدخل الاسم واسم المستخدم وكلمة مرور 4 أحرف على الأقل');return}if(db.users.some(u=>u.username===username)){toast('اسم المستخدم مستخدم بالفعل');return}db.users.push({name,username,password,role:'employee'});save();renderUsers();toast('تم إنشاء حساب الموظف')};function removeUser(u){if(!confirm('حذف حساب الموظف؟'))return;db.users=db.users.filter(x=>x.username!==u);save();renderUsers()}
function renderSettings(){document.getElementById('page-settings').innerHTML=`<div class="pagehead"><div><h2>الإعدادات</h2><div class="muted">إدارة بيانات الدخول والنسخ الاحتياطي</div></div></div><div class="panel"><h3>تغيير كلمة المرور الحالية</h3><div class="formgrid"><div class="field"><label>كلمة المرور الحالية</label><input id="oldPass" type="password"></div><div class="field"><label>كلمة المرور الجديدة</label><input id="newPass" type="password"></div></div><div class="actions"><button onclick="changePass()">تغيير كلمة المرور</button></div></div><div class="panel"><h3>نسخة احتياطية</h3><p class="footnote">نزّل نسخة JSON للاحتفاظ بالبيانات. احتفظ بها في مكان آمن ولا ترسلها إلا للمخولين.</p><div class="actions"><button onclick="backup()">تنزيل نسخة احتياطية</button><label class="secondary" style="padding:11px 15px;border-radius:10px;cursor:pointer">استعادة نسخة JSON <input type="file" accept="application/json" onchange="restoreBackup(event)" hidden></label></div></div><div class="notice">نسخة العرض الحالية تحفظ البيانات في المتصفح على هذا الجهاز فقط. لا يوجد حتى الآن تزامن سحابي بين أجهزة الموظفين، ولا تعتبر هذه النسخة جاهزة لبيانات الشركة الحقيقية قبل ربطها بخادم وقاعدة بيانات وصلاحيات آمنة.</div>`}
function changePass(){let a=document.getElementById('oldPass').value,b=document.getElementById('newPass').value,u=db.users.find(x=>x.username===session.username);if(u.password!==a){toast('كلمة المرور الحالية غير صحيحة');return}if(b.length<4){toast('كلمة المرور الجديدة قصيرة');return}u.password=b;session=u;save();toast('تم تغيير كلمة المرور')};function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});download(blob,'TC24-backup-'+today()+'.json')};function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.users||!x.customers||!x.orders||!x.collections)throw Error();if(!confirm('سيتم استبدال البيانات الحالية. هل أنت متأكد؟'))return;db=x;save();renderAll();toast('تمت استعادة النسخة')}catch(_){toast('ملف النسخة الاحتياطية غير صالح')}};r.readAsText(f)}
function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}function csv(rows,filename){let text='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob([text],{type:'text/csv;charset=utf-8'}),filename+'.csv')}
function exportCSV(type){if(type==='customers'){let rows=[['رقم الكود','اسم العميل','رقم الجوال','الحي / المنطقة','عدد الطلبات','إجمالي المبيعات','تاريخ التسجيل'],...db.customers.map(c=>{let os=db.orders.filter(o=>o.customerId===c.id);return[c.code,c.name,c.phone,c.area,os.length,sum(os,'amount'),c.createdAt?new Date(c.createdAt).toISOString().slice(0,10):'']})];csv(rows,'TC24-customers-'+today())}else if(type==='collections'){csv([['التاريخ','رقم الكود','اسم العميل','المبلغ SAR','طريقة التحصيل','ملاحظات','المسجل'],...db.collections.map(c=>{let x=db.customers.find(z=>z.id===c.customerId);return[c.date,x?.code||'',x?.name||'',c.amount,c.method,c.note,c.createdBy]})],'TC24-collections-'+today())}else if(type==='orders'){csv([['تاريخ الطلب','رقم الكود','اسم العميل','الجوال','المنطقة','عدد الدكت','عدد الاسبليت','عدد الفلتر','عدد الماكينة','قيمة الطلب SAR','الحالة','ملاحظات','المسجل'],...db.orders.map(o=>{let c=db.customers.find(x=>x.id===o.customerId)||{};return[o.date,c.code||o.code,c.name,c.phone,c.area,o.duct,o.split,o.filter,o.machine,o.amount,o.status,o.notes,o.createdBy]})],'TC24-orders-'+today())}else{let ms=[...new Set(db.orders.map(o=>o.date.slice(0,7)))].sort();csv([['الشهر','عدد العملاء الجدد','عدد الطلبات','الطلبات المنفذة','إجمالي المبيعات SAR','إجمالي التحصيلات SAR','دكت','اسبليت','فلتر','ماكينة'],...ms.map(m=>{let os=db.orders.filter(o=>o.date.startsWith(m)),cs=db.collections.filter(c=>c.date.startsWith(m));return[m,db.customers.filter(c=>c.createdAt&&new Date(c.createdAt).toISOString().startsWith(m)).length,os.length,os.filter(o=>o.status==='تم التنفيذ').length,sum(os,'amount'),sum(cs,'amount'),sum(os,'duct'),sum(os,'split'),sum(os,'filter'),sum(os,'machine')]})],'TC24-monthly-report-'+today())}toast('تم تجهيز ملف CSV المتوافق مع Excel')}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!document.getElementById('loginView').classList.contains('hidden'))login()});load();
